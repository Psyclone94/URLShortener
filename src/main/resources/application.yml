spring:
  application:
    name: URL-Shortener
  datasource:
    url: jdbc:postgresql://localhost:5432/urlshort
    username: urlshort
    password: urlshort
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 10000
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    

server:
  port: 8080

app:
  base-url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.flywaydb: DEBUG