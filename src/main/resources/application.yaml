spring:
  application:
    name: URL-Shortener
  datasource:
    url: jdbc:postgresql://localhost:5432/urlshort
    username: urlshort
    password: urlshort
  flyway:
    enabled: true

server:
  port: 8080

app:
  base-url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always